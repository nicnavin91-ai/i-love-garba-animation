<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Love Garba</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFC568;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Fixed 500x200 stage; scaled as a whole so mo.js pixel offsets stay correct */
    .stage { width: 500px; height: 200px; transform-origin: center; }
    .container { width: 500px; height: 200px; position: relative; }
    .svg-container { position: absolute; inset: 0; z-index: 2; overflow: visible; }
    .mo-container { width: 100%; height: 100%; }

    .line {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .lttr { fill: #763C8C; transform-box: fill-box; transform-origin: center; }

    .sound {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: none;
      border: 0;
      color: #763C8C;
      font: inherit;
      font-size: 16px;
      text-decoration: line-through;
      cursor: pointer;
    }
    .sound--on { text-decoration: underline; }

  </style>
</head>
<body>

          <path class="lttr" data-part="word" data-char="A" d="M295.9 118.7L287.0 118.7L303.7 81.3L312.3 81.3L329.0 118.7L319.9 118.7L316.6 110.7L299.2 110.7L295.9 118.7ZM302.0 104.1L313.9 104.1L307.9 89.8L302.0 104.1Z"></path>

          <path class="lttr" data-part="word" data-char="B" d="M391.5 118.7L372.1 118.7L372.1 81.3L390.4 81.3Q397.4 81.3 401.0 84.0Q404.5 86.6 404.5 91.0L404.5 91.0Q404.5 94.0 403.1 96.1L403.1 96.1Q401.8 98.1 399.6 99.2L399.6 99.2Q400.2 99.4 400.6 99.6L400.6 99.6Q403.4 100.7 404.9 103.0Q406.4 105.2 406.4 108.5L406.4 108.5Q406.4 113.3 402.6 116.0Q398.8 118.7 391.5 118.7L391.5 118.7ZM380.7 102.9L380.7 112.2L390.8 112.2Q394.2 112.2 395.9 111.1Q397.7 110.0 397.7 107.6L397.7 107.6Q397.7 105.2 395.9 104.1Q394.2 102.9 390.8 102.9L390.8 102.9L380.7 102.9ZM380.7 87.8L380.7 96.6L389.3 96.6Q392.5 96.6 394.2 95.5Q395.8 94.4 395.8 92.2L395.8 92.2Q395.8 90.0 394.2 88.9Q392.5 87.8 389.3 87.8L389.3 87.8L380.7 87.8Z"></path>
          <path class="lttr" data-part="word" data-char="A" d="M416.9 118.7L408.1 118.7L424.7 81.3L433.3 81.3L450 118.7L440.9 118.7L437.6 110.7L420.2 110.7L416.9 118.7ZM423.0 104.1L434.9 104.1L429.0 89.8L423.0 104.1Z"></path>
        </g>
      </svg>
      <div class="mo-container"></div>
    </div>
  </div>

  <button class="sound" type="button">sound</button>

  <script src="https://cdn.jsdelivr.net/npm/@mojs/core@1.7.1/dist/mo.umd.js"></script>
  <script>
    const qs = document.querySelector.bind(document);
    const easingHeart = mojs.easing.path('M0,100C2.9,86.7,33.6-7.3,46-7.3s15.2,22.7,26,22.7S89,0,100,0');

    const el = {
      stage: qs('.stage'),
      container: qs('.mo-container'),
      i: qs('[data-part="i"]'),
      word: [...document.querySelectorAll('[data-part="word"]')],
      lineLeft: qs('.line--left'),
      lineRight: qs('.line--rght'),
      colTxt: '#763c8c',
      colHeart: '#fa4843',
      sound: qs('.sound'),
    };
    const love = [...document.querySelectorAll('[data-part="love"]')];
    const letters = [el.i, ...love, ...el.word];

    // --- Sound: synthesized "blop" (the original freesound mp3 is no longer reachable) ---
    let audioCtx = null;
    let soundOn = false;
    const volume = 0.2;

    const pop = (from, to, len) => {
      if (!soundOn || !audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + len);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + len + 0.02);
    };
    const blop = () => pop(620, 180, 0.12);
    const blup = () => pop(380, 900, 0.16);

    el.sound.addEventListener('click', () => {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      soundOn = !soundOn;
      el.sound.classList.toggle('sound--on', soundOn);
    });

    // --- Heart shape ---
    class Heart extends mojs.CustomShape {
      getShape() {
        return '<path d="M50,88.9C25.5,78.2,0.5,54.4,3.8,31.1S41.3,1.8,50,29.9c8.7-28.2,42.8-22.2,46.2,1.2S74.5,78.2,50,88.9z"/>';
      }
      getLength() { return 200; }
    }
    mojs.addShape('heart', Heart);

    const resetLetters = (opacity = 1) => {
      letters.forEach(l => {
        l.style.cssText = `transform: translate(0px, 0px) rotate(0deg) skew(0deg, 0deg) scale(1, 1); opacity: ${opacity};`;
      });
    };

    const crtBoom = (delay = 0, x = 0, rd = 46) => {
      const parent = el.container;
      const crcl = new mojs.Shape({
        shape: 'circle',
        fill: 'none',
        stroke: el.colTxt,
        strokeWidth: { 5: 0 },
        radius: { [rd]: [rd + 20] },
        easing: 'quint.out',
        duration: 500 / 3,
        parent,
        delay,
        x,
      });

      const brst = new mojs.Burst({
        radius: { [rd + 15]: 110 },
        angle: 'rand(60, 180)',
        count: 3,
        timeline: { delay },
        parent,
        x,
        children: {
          radius: [5, 3, 7],
          fill: el.colTxt,
          scale: { 1: 0, easing: 'quad.in' },
          pathScale: [.8, null],
          degreeShift: ['rand(13, 60)', null],
          duration: 1000 / 3,
          easing: 'quint.out',
        },
      });

      return [crcl, brst];
    };

    // Horizontal centre of a set of letters, in stage px (the SVG viewBox is 1:1 with the 500x200 stage)
    const centerOf = (...els) => {
      const boxes = els.map(n => n.getBBox());
      const left = Math.min(...boxes.map(b => b.x));
      const right = Math.max(...boxes.map(b => b.x + b.width));
      return { left, right, mid: (left + right) / 2 };
    };

    const crtLoveTl = () => {
      const easing = 'sin.inOut';
      const easingBoom = 'sin.in';
      const easingOut = 'sin.out';
      const STAGE_MID = 250;

      // Timeline beats (ms)
      const SQUEEZE = 1000;   // LOVE squeezes together, then turns into the heart
      const CLOSE_AT = 1200;  // I and the word close in around the heart
      const CLOSE = 1000;
      const HOLD = 500;       // "I ♥ WORD" holds
      const COLLAPSE_AT = CLOSE_AT + CLOSE + HOLD;  // 2700: everything folds into the heart
      const COLLAPSE = 700;
      const BOOM_AT = COLLAPSE_AT + COLLAPSE;        // 3400
      const OUT_AT = 3900;
      const OUT = 350;
      const FADE_IN_AT = 4300;

      // Heart sizes were tuned for 37.4px-tall letters; k rescales them for other words
      const k = el.i.getBBox().height / 37.4;
      const HEART_REST = 0.5 * k;
      const HEART_W = 46 * k; // visual width of the heart at HEART_REST
      const GAP = 14 * k;

      const loveBox = centerOf(...love);
      const iBox = centerOf(el.i);
      const wordBox = centerOf(...el.word);

      // "I ♥ WORD" laid out and centred on the stage
      const iW = iBox.right - iBox.left;
      const wordW = wordBox.right - wordBox.left;
      const rowLeft = STAGE_MID - (iW + GAP + HEART_W + GAP + wordW) / 2;
      const iShift = rowLeft - iBox.left;
      const heartMid = rowLeft + iW + GAP + HEART_W / 2;
      const wordShift = rowLeft + iW + GAP + HEART_W + GAP - wordBox.left;
      const rowRight = rowLeft + iW + GAP + HEART_W + GAP + wordW;

      // White bars hug whatever is on screen, 22px away
      const HUG = 22;
      const lineL = x => x - HUG - 10;
      const lineR = x => x + HUG - 490;
      const textLeft = iBox.left;
      const textRight = wordBox.right;

      const bar = (node, side) => new mojs.Html({ el: node, duration: SQUEEZE, easing, x: { 0: side(side === lineL ? textLeft : textRight) } })
        .then({ duration: CLOSE_AT - SQUEEZE })
        .then({ duration: CLOSE, easing, x: { to: side(side === lineL ? rowLeft : rowRight) } })
        .then({ duration: HOLD })
        .then({ duration: COLLAPSE, easing: easingBoom, x: { to: side(STAGE_MID + (side === lineL ? -42 * k : 42 * k)) } })
        .then({ duration: OUT_AT - BOOM_AT })
        .then({ duration: OUT, easing: easingOut, x: { to: 0 } });

      // A letter that rides along to "I ♥ WORD", then folds into the heart
      const rider = (node, shift) => {
        const mid = centerOf(node).mid;
        return new mojs.Html({ el: node, duration: CLOSE_AT, opacity: 1, x: { 0: 0 } })
          .then({ duration: CLOSE, easing, x: { to: shift } })
          .then({ duration: HOLD })
          .then({ duration: COLLAPSE, easing: easingBoom, x: { to: STAGE_MID - mid }, scale: { to: 0.3 } });
      };

      return new mojs.Timeline().add([
        new mojs.Tween({
          duration: SQUEEZE,
          onStart: () => resetLetters(1),
          onComplete: () => {
            love.forEach(l => l.style.opacity = 0);
            blop();
          },
        }),

        new mojs.Tween({
          duration: BOOM_AT,
          onComplete: () => {
            [el.i, ...el.word].forEach(l => l.style.opacity = 0);
            blup();
          },
        }),

        new mojs.Tween({
          duration: 50,
          delay: FADE_IN_AT,
          onUpdate: progress => resetLetters(progress),
          onComplete: () => resetLetters(1),
        }),

        bar(el.lineLeft, lineL),
        bar(el.lineRight, lineR),

        // I [LOVE] WORD: squeeze toward the middle of the word
        ...love.map(node => new mojs.Html({
          el: node, duration: SQUEEZE, easing, opacity: 1,
          x: { 0: (loveBox.mid - centerOf(node).mid) * 0.3 },
        })),

        rider(el.i, iShift),
        ...el.word.map(node => rider(node, wordShift)),

        new mojs.Shape({
          parent: el.container,
          shape: 'heart',
          delay: SQUEEZE,
          fill: el.colHeart,
          x: loveBox.mid - STAGE_MID,
          scale: { 0: 0.7 * k, easing: easingHeart },
          duration: 500,
        })
          .then({ duration: CLOSE_AT + CLOSE - SQUEEZE - 500, easing, x: { to: heartMid - STAGE_MID }, scale: { to: HEART_REST } })
          .then({ duration: HOLD - 200 })
          .then({ duration: 200, scale: { to: 0.58 * k }, easing: easingOut })
          .then({ duration: COLLAPSE, x: { to: 0 }, scale: { to: 0.4 * k }, easing: easingBoom })
          .then({ duration: 150, scale: { to: 0.75 * k }, easing: easingOut })
          .then({ duration: 125, scale: { to: 0.62 * k }, easing: easingOut })
          .then({ duration: 125, scale: { to: 0.66 * k }, easing: easingOut })
          .then({ duration: OUT_AT - BOOM_AT - 400 })
          .then({ duration: OUT, scale: { to: 0 }, easing: easingOut }),

        ...crtBoom(SQUEEZE, loveBox.mid - STAGE_MID, 34 * k),
        ...crtBoom(BOOM_AT, 0, 36 * k),
      ]);
    };

    // Scale the fixed-size stage to fit narrow viewports (16px gutter each side)
    const fit = () => {
      const s = Math.min(1, (window.innerWidth - 32) / 500);
      el.stage.style.transform = `scale(${s})`;
    };
    window.addEventListener('resize', fit);
    fit();

    const loveTl = crtLoveTl();
    const freezeAt = new URLSearchParams(location.search).get('t');

    if (freezeAt !== null) {
      // index.html?t=2500 freezes on the frame at 2.5s (for stills and checks).
      // Step forward from 0 so every chained segment and callback fires in order.
      const total = loveTl._props.duration;
      for (let t = 0; t <= Math.min(+freezeAt, total); t += 25) loveTl.setProgress(t / total);
    } else {
      loveTl.play();
      setInterval(() => loveTl.replay(), 4600);
    }
  </script>
</body>
</html>
